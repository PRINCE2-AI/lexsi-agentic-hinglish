name: verify

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: pip install pytest
      - name: Unit tests
        run: python -m pytest -q
      - name: Dataset pins, oracle and scoring
        run: python scripts/verify_all.py
      - name: Guard tables
        run: python scripts/guard_eval.py
